<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartHome</title>

    <!-- Styles -->
    <link rel="stylesheet" href="./smarthome.css">

    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>

<body>

<!-- SmartHome Base Template -->
<div id="smarthome-root">
    <div id="sh-floor-list"></div>
    <canvas id="smarthome-canvas"></canvas>
    <div id="smarthome-overlay"></div>
</div>

<!-- Editor Titelbar -->
<div id="editor-titlebar" style="display:none;">
    <div id="editor-titlebar-left">
        <span id="editor-title">Room Designer</span>
    </div>

    <div id="editor-titlebar-right">
        <button id="editor-close-btn">Schließen</button>
    </div>
</div>

<!-- Editor Sidebar (rechts) -->
<div id="editor-sidebar" style="display:none;">
    <div id="editor-sidebar-tabs">
        <button data-tab="tools" class="active">Tools</button>
        <button data-tab="elements">Elemente</button>
        <button data-tab="settings">Einstellungen</button>
    </div>

    <div id="editor-sidebar-content">
        <!-- Inhalt wird später dynamisch gefüllt -->
        <div class="sidebar-panel" data-panel="tools">Tools kommen hier rein</div>
        <div class="sidebar-panel" data-panel="elements" style="display:none;">Elemente kommen hier rein</div>
        <div class="sidebar-panel" data-panel="settings" style="display:none;">Einstellungen kommen hier rein</div>
    </div>
</div>

    
    
<!-- Schritt 1: Raumdesigner-Canvas -->
<canvas id="roomdesigner" style="display:none;"></canvas>


<!-- Schritt 6: Tür-Modus Button -->
<button id="btnDoorMode" class="editor-btn" style="
    position: absolute;
    top: 20px;
    right: 20px;
    padding: 12px 20px;
    background: #4a90e2;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 16px;
    z-index: 9999;
    display: none;
">Tür platzieren</button>

    <button id="btnWindowMode"
        style="
            position: fixed;
            top: 70px;
            left: 20px;
            padding: 12px 18px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            z-index: 9999;
            display: none;
        ">
    Fenster
</button>


<!-- Debug: Editor öffnen -->
<button id="btnOpenEditor" style="
    position: absolute;
    top: 70px;
    right: 20px;
    padding: 12px 20px;
    background: #27ae60;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 16px;
    z-index: 9999;
">Editor öffnen</button>

    
<button id="btnResetView">Reset</button>

  <button id="btnSnapToggle">Snap</button>
  <input type="range" id="gridSizeSlider" min="10" max="120" step="10" value="40">


<!-- Group Header -->
<div id="sh-group-header" class="hidden">
    <div id="sh-group-back" class="material-icons">arrow_back</div>
    <div id="sh-group-title"></div>
    <div id="sh-group-rooms"></div>
</div>

<!-- Popup -->
<div id="smarthome-popup" class="sh-popup hidden">
    <div class="sh-popup-content">
        <div class="sh-popup-header">
            <span id="sh-popup-icon" class="material-icons"></span>
            <span id="sh-popup-title"></span>
            <button id="sh-popup-close" class="sh-popup-close material-icons">close</button>
        </div>

        <div class="sh-popup-tabs">
            <button data-tab="status">Status</button>
            <button data-tab="actions">Aktionen</button>
            <button data-tab="history">Historie</button>
            <button data-tab="devices">Geräte</button>
        </div>

        <div id="sh-popup-body" class="sh-popup-body"></div>
    </div>
</div>

<!-- Minimap -->
<div id="smarthome-minimap">
    <canvas id="smarthome-minimap-canvas"></canvas>
</div>

<!-- Scripts (richtige Reihenfolge!) -->
<script src="smarthome.data.js"></script>
<script src="smarthome.view.js"></script>
<script src="smarthome.groups.js"></script>
<script src="smarthome.theme.js"></script>
<script src="smarthome.module.js"></script>

<!-- Editor Script -->
<script src="smarthome.editor.js?v=1"></script>
<script src="smarthome.ui.js"></script>

<!-- Start -->
<script>
    SmartHomeModule.init();
</script>

</body>
</html>
